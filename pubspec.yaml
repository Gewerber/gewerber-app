name: gewerber_app
description: Gewerber client application (web, mobile, desktop).
version: 1.0.0+1
publish_to: none
homepage: https://app.gewerber.de
repository: https://github.com/Gewerber/gewerber-app
issue_tracker: https://github.com/Gewerber/gewerber-app/issues
topics:
  - flutter
  - web
  - invoicing
  - time-tracking

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  go_router: ^17.4.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: any
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  injectable_generator: ^3.1.1

dependency_overrides:
  analyzer: 13.0.0
  dart_style: 3.1.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/gewerber-symbol.svg
