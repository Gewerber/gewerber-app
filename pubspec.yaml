name: gewerber_app
description: Gewerber client application (web, mobile, desktop).
version: 1.0.0+1
publish_to: none
homepage: https://app.gewerber.de
repository: https://github.com/Gewerber/gewerber-app
issue_tracker: https://github.com/Gewerber/gewerber-app/issues
topics:
  - flutter
  - web
  - invoicing
  - time-tracking

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  go_router: ^17.5.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  serverpod_flutter: 4.0.0-beta.3
  serverpod_auth_core_flutter: 4.0.0-beta.3
  serverpod_auth_idp_flutter: 4.0.0-beta.3
  serverpod_auth_core_client: 4.0.0-beta.3
  serverpod_auth_idp_client: 4.0.0-beta.3
  gewerber_backend_client:
    git:
      url: https://github.com/Gewerber/gewerber-backend-core.git
      path: gewerber_backend_client
      ref: main
  flutter_animate: ^4.5.2
  flutter_flavor: ^3.1.4
  file_saver: ^0.4.0
  # Receipt upload + documents screen: native/web file selection
  # (web, Android, iOS, desktop; wasm-ready).
  file_picker: ^12.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  injectable_generator: ^3.1.3

dependency_overrides:
  analyzer: 13.0.0
  dart_style: 3.1.9
  # The generated client SDK references the commercial client even though it
  # is not declared in its pubspec; resolve it from the commercial repo.
  gewerber_commercial_client:
    git:
      url: https://github.com/Gewerber/gewerber-backend-commercial.git
      path: gewerber_commercial_client
      ref: main

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/gewerber-symbol.svg
