# Continuous integration: static analysis and tests.
#
# Runs on:
#   - every push to main/develop (before the Deploy workflow is started)
#   - every pull request
# The Deploy workflow calls this workflow as its first job (`needs: ci`),
# so a red build can never reach the VPS.
#
# No repository secrets are required: all dependencies are public. The
# commercial client resolves against the stub packages in
# Gewerber/gewerber-backend-stubs; closed features are composed in the
# private gewerber-app-commercial repository, not here.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the local dev SDK; 3.44.x pins intl 0.20.2 via
          # flutter_localizations, which conflicts with the intl ^0.20.3
          # required since #24 (visual hierarchy).
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n)
        run: flutter gen-l10n

      - name: Generate code (injectable)
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
