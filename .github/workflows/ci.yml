# Continuous integration: static analysis and tests.
#
# Runs on:
#   - every push to main/develop (before the Deploy workflow is started)
#   - every pull request
# The Deploy workflow calls this workflow as its first job (`needs: ci`),
# so a red build can never reach the VPS.
#
# No repository secrets are required: all dependencies are public. The
# commercial client resolves against the stub packages in
# Gewerber/gewerber-backend-stubs; closed features are composed in the
# private gewerber-app-commercial repository, not here.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter 3.47.3 = Dart 3.13.3 (workspace SDK constraint).
          # 3.44.x pinned intl 0.20.2 via flutter_localizations, which
          # conflicted with intl ^0.20.3 required since #24 (visual
          # hierarchy) — kept above that line.
          flutter-version: 3.47.3
          cache: true

      # Pre-release pairing: consume `gewerber_backend_client` and the
      # commercial stubs from their `develop` branches (rc.2) while the
      # release train hasn't published rc.2 to `main`; main builds keep
      # `ref: main`. See tool/retarget_gewerber_refs.sh.
      - name: Inter-repo deps follow the target branch
        if: github.ref_name == 'develop' || github.base_ref == 'develop'
        run: sh tool/retarget_gewerber_refs.sh develop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n)
        run: flutter gen-l10n

      - name: Generate code (injectable)
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
