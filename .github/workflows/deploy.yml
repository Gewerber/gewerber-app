# Builds the app image, pushes it to GHCR and deploys it to the VPS via SSH.
#
#   push to main    -> environment "production" -> https://app.gewerber.de
#   push to develop -> environment "staging"    -> https://test.app.gewerber.de
#
# Required repository/environment secrets:
#   VPS_HOST    – VPS address
#   VPS_USER    – SSH user on the VPS
#   VPS_SSH_KEY – SSH private key (deploy key) for the VPS
#   GHCR_TOKEN  – PAT with read:packages, used by the VPS to pull the image
#                 (omit only if the GHCR package is public)
#   COMMERCIAL_REPO_TOKEN – PAT with read access to the private
#                 gewerber-backend-commercial repository (git dependency)
#
# Create two GitHub environments: "production" (protect it as desired) and
# "staging". Secrets can be set per environment or at repository level.

name: Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      # API endpoint baked into the web build (see Dockerfile ARG SERVER_HOST).
      SERVER_HOST: ${{ github.ref_name == 'main' && 'https://api.gewerber.de' || 'https://api.test.gewerber.de' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: |
          echo "name=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=${{ env.DEPLOY_ENV }}-latest
            type=sha,prefix=${{ env.DEPLOY_ENV }}-
          labels: |
            org.opencontainers.image.title=Gewerber App
            org.opencontainers.image.description=Gewerber client application (app.gewerber.de)

      - name: Verify private dependency token
        env:
          COMMERCIAL_REPO_TOKEN: ${{ secrets.COMMERCIAL_REPO_TOKEN }}
        run: |
          if [ -z "$COMMERCIAL_REPO_TOKEN" ]; then
            echo "::error::Secret COMMERCIAL_REPO_TOKEN is not set. Create a token with read access to the private gewerber-backend-commercial repository (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVER_HOST=${{ env.SERVER_HOST }}
            FLAVOR=${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Grants `flutter pub get` access to the private
          # gewerber-backend-commercial git dependency.
          secrets: |
            commercial_token=${{ secrets.COMMERCIAL_REPO_TOKEN }}

      - name: Copy compose + deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,deploy/deploy.sh"
          target: "gewerber/app/${{ env.DEPLOY_ENV }}/_in"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,IMAGE_REF,GHCR_USER,GHCR_TOKEN,TRAEFIK_NETWORK,WEB_ENTRYPOINT,WEBSECURE_ENTRYPOINT,CERT_RESOLVER
          script: |
            set -eu
            WORK="$HOME/gewerber/app/$DEPLOY_ENV/_in"
            cp -f "$WORK/docker-compose.yml" "$WORK/deploy/docker-compose.yml"
            bash "$WORK/deploy/deploy.sh" "$DEPLOY_ENV" "$IMAGE_REF"
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}:${{ env.DEPLOY_ENV }}-latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Traefik integration (override via repository/environment variables).
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK || 'web' }}
          WEB_ENTRYPOINT: ${{ vars.WEB_ENTRYPOINT || 'web' }}
          WEBSECURE_ENTRYPOINT: ${{ vars.WEBSECURE_ENTRYPOINT || 'websecure' }}
          CERT_RESOLVER: ${{ vars.CERT_RESOLVER || 'letsencrypt' }}
