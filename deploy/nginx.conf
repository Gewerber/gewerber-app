# nginx config for the Flutter Web build served by the Gewerber App container.
# Flutter Web performs client-side routing, so every path must fall back to
# index.html so that deep links / route changes are resolved by the app.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter build assets are content-hashed -> safe to cache permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:js|css|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references the hashed bootstrap, so never cache it long term.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}